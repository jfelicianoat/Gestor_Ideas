[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gestor-ideas"
version = "0.1.0"
description = "Aplicación desktop para captura, transcripción y enriquecimiento de ideas con IA local"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "jfelicianoat"}
]

dependencies = [
    "PySide6>=6.6,<7",
    "SQLModel>=0.0.16,<1",
    "faster-whisper>=1.0,<2",
    "httpx>=0.27,<1",
    "pydub>=0.25,<1",
    "pypdf>=4.0,<5",
    "pyyaml>=6.0,<7",
    "loguru>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "black>=24.0,<25",
]

[project.scripts]
gestor-ideas = "adaptador.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
